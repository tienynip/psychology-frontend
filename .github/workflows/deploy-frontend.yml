
name: CI/CD Frontend to Amazon ECS

# Workflow triggers
on:
  push:
    branches:
      - main

  workflow_dispatch:

# Workflow permissions
permissions:
  contents: read

# Prevent concurrent production deployments
concurrency:
  group: psychology-frontend-production
  cancel-in-progress: false

# Global environment variables
env:
  AWS_REGION: ap-northeast-3

  ECR_REPOSITORY: myproject-frontend

  ECS_CLUSTER: myproject-dev-cluster
  ECS_SERVICE: myproject-dev-frontend

  # IMPORTANT:
  # Must exactly match containerDefinitions[].name
  # in the ECS Task Definition.
  CONTAINER_NAME: frontend

# Jobs
jobs:

  # ==========================================
  # JOB 1: VALIDATE FRONTEND
  # ==========================================
  validate:
    name: Validate frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # Checkout source code
      - name: Checkout source
        uses: actions/checkout@v6

      # Setup Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Build frontend
      - name: Build frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

  # ==========================================
  # JOB 2: BUILD AND DEPLOY
  # ==========================================
  deploy:
    name: Build and deploy to ECS
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # Checkout source code
      - name: Checkout source
        uses: actions/checkout@v6

      # Show GitHub context
      - name: Show GitHub context
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Ref: $GITHUB_REF"
          echo "Commit: $GITHUB_SHA"

      # ======================================
      # AWS AUTHENTICATION
      # ======================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ======================================
      # LOGIN TO AMAZON ECR
      # ======================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ======================================
      # PREPARE DOCKER IMAGE URI
      # ======================================
      - name: Prepare immutable image URI
        id: image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}
        run: |
          echo "uri=$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # ======================================
      # SETUP DOCKER BUILDX
      # ======================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ======================================
      # BUILD AND PUSH DOCKER IMAGE
      # ======================================
      - name: Build and push AMD64 image
        id: build-image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true

          provenance: false
          sbom: false

          tags: ${{ steps.image.outputs.uri }}

          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ======================================
      # DOWNLOAD CURRENT ECS TASK DEFINITION
      # ======================================
      - name: Download ECS task definition
        run: |
          TASK_DEFINITION_ARN=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].taskDefinition' \
            --output text)

          if [ -z "$TASK_DEFINITION_ARN" ] || [ "$TASK_DEFINITION_ARN" = "None" ]; then
            echo "Error: ECS Task Definition not found."
            exit 1
          fi

          echo "Current Task Definition: $TASK_DEFINITION_ARN"

          aws ecs describe-task-definition \
            --task-definition "$TASK_DEFINITION_ARN" \
            --query 'taskDefinition' \
            --output json \
            > task-definition.json

      # ======================================
      # RENDER NEW IMAGE INTO TASK DEFINITION
      # ======================================
      - name: Render ECS task definition
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      # ======================================
      # DEPLOY TO ECS
      # ======================================
      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
